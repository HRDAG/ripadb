{% extends "base.html" %}
{% block title %}Articles - RIPA Explorer{% endblock %}

{% block content %}
<h1>Articles</h1>
<p class="intro">Guides and analysis of California RIPA stop data.</p>

<div class="article-list">
{% for article in articles %}
    <a href="{{ root_path }}/articles/{{ article.slug }}" class="article-item">
        <h2>{{ article.title }}</h2>
        <p class="article-meta">{{ article.date }}</p>
        <p class="article-summary">{{ article.summary }}</p>
    </a>
{% endfor %}
</div>
{% endblock %}
