<div class="tab-panel">
    <h2>Stops per Year</h2>
    <div class="chart-container">
        <canvas id="stopsChart"></canvas>
    </div>
    <p id="chartFootnote" class="footnote" style="display:none;">* 2018 data covers Jul–Dec only (RIPA reporting began July 1, 2018).</p>

    <table class="data-table">
        <thead>
            <tr>
                <th>Year</th>
                <th class="num">Person-Stops</th>
                <th class="num">Unique Stops</th>
            </tr>
        </thead>
        <tbody>
            {% for s in stops_by_year %}
            <tr>
                <td>{% if s.year == 2018 %}2018 (Jul–Dec){% else %}{{ s.year }}{% endif %}</td>
                <td class="num">{{ s.n_person_stops|commas }}</td>
                <td class="num">{{ s.n_stops|commas }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
fetch('{{ root_path }}/api/agency/{{ ori }}/chart-data')
    .then(r => r.json())
    .then(data => {
        const ctx = document.getElementById('stopsChart');
        if (!ctx) return;
        const has2018 = data.labels.includes(2018);
        const labels = data.labels.map(y => y === 2018 ? '2018*' : String(y));
        if (has2018) {
            document.getElementById('chartFootnote').style.display = '';
        }
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Person-Stops',
                    data: data.person_stops,
                    backgroundColor: '#4a7c9b'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: items => {
                                const lbl = items[0].label;
                                if (lbl === '2018*') return '2018 (Jul–Dec only)';
                                return lbl;
                            }
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, ticks: {
                        callback: v => v.toLocaleString()
                    }}
                }
            }
        });
    });
</script>
