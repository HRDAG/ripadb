# LOC_CLOSEST_CITY values that don't match a Census place name.
# Keys are matched after the same normalization as place names (case,
# accents, punctuation, ST->SAINT, MT->MOUNT, MC X->MCX). Targets:
#   place: <Census Gazetteer place NAME, with LSAD suffix>
#   county: <county name without " County">
#   none: true   -- deliberately unresolved (e.g. out of state)
# Any target may add `agency_county: <county>` to apply only to stops from
# that source file; a target may also be a list of such scoped targets.
# Names not listed here and not matching a place fall back to the agency's
# county (see src/build_city_crosswalk.py), so only names where a place is
# clearly better than the county centroid are listed. Precision needed is
# modest: 1 degree of longitude ~ 4 minutes of sunset time.
aliases:
  OUT OF STATE CITY: {none: true}

