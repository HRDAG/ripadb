<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RIPA Agency Explorer{% endblock %}</title>
    <link rel="stylesheet" href="{{ root_path }}/static/style.css">
    <script src="{{ root_path }}/static/htmx.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="{{ root_path }}/" class="logo">RIPA Explorer</a>
            <div class="nav-links">
                <a href="{{ root_path }}/">Agencies</a>
                <a href="{{ root_path }}/articles">Articles</a>
                <a href="{{ root_path }}/articles/about-the-data">About the Data</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Data: <a href="https://openjustice.doj.ca.gov/data">CA DOJ OpenJustice</a> | RIPA Stop Data 2018-2024 | <a href="{{ root_path }}/articles/about-the-data">About the Data</a> | <a href="{{ root_path }}/articles/about-the-site">About this Site</a></p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
