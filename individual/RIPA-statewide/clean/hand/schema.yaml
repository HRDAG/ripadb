  - AGENCY_NAME
  - NON_REPORTING_AGENCY          # 2024 only

  # === Stop context ===
  - TIME_OF_STOP
  - DATE_OF_STOP
  - STOP_DURATION
  - LOC_CLOSEST_CITY              # canonical name (was CLOSEST_CITY)

  # === School ===
  - SCHOOL_CODE
  - SCHOOL_NAME
  - STOP_STUDENT
  - K12_SCHOOL_GROUNDS

  # === Race/ethnicity ===
