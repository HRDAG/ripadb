<div class="tab-panel">
    <h2>Stops per Year</h2>
    <div class="chart-container">
        <canvas id="stopsChart"></canvas>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Year</th>
                <th class="num">Person-Stops</th>
                <th class="num">Unique Stops</th>
            </tr>
        </thead>
        <tbody>
            {% for s in stops_by_year %}
            <tr>
                <td>{{ s.year }}</td>
                <td class="num">{{ s.n_person_stops|commas }}</td>
                <td class="num">{{ s.n_stops|commas }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
fetch('{{ root_path }}/api/agency/{{ ori }}/chart-data')
    .then(r => r.json())
    .then(data => {
        const ctx = document.getElementById('stopsChart');
        if (!ctx) return;
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Person-Stops',
                    data: data.person_stops,
                    backgroundColor: '#4a7c9b'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: {
                        callback: v => v.toLocaleString()
                    }}
                }
            }
        });
    });
</script>
