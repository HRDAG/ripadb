  - RAE_ASIAN
  - RAE_BLACK_AFRICAN_AMERICAN
  - RAE_HISPANIC_LATINEX          # canonical name (was RAE_HISPANIC_LATINO)
  - RAE_MIDDLE_EASTERN_SOUTH_ASIAN
  - RAE_NATIVE_AMERICAN
