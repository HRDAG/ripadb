# RIPA statewide stop data — target schema definition
#
# The target schema is the UNION of all columns across all years (2018-2024).
# Columns that don't exist for a given year are filled with NULL.
# Renamed columns are mapped to their canonical (2024) name.
#
# Schema eras:
#   2018-2023: 142 columns, ADS_* actions, G_MALE/G_FEMALE, LGBT
#   2024:      202 columns, NFA_*/OFA_* actions, G_CISGENDER_MAN/WOMAN, SOR_LGB/SOR_STRAIGHT

# Columns that changed names between eras.
# old_name -> canonical_name (using 2024 names where possible)
renames:
  CLOSEST_CITY: LOC_CLOSEST_CITY
  G_MALE: G_CISGENDER_MAN
  G_FEMALE: G_CISGENDER_WOMAN
  G_GENDER_NONCONFORMING: G_NONBINARY_PERSON
  RAE_HISPANIC_LATINO: RAE_HISPANIC_LATINEX
  LGBT: SOR_LGB
  PD_DISAB_MULTI: PD_MULTI  # 2018-2020 only; values: Blank->0, 1->1, 2->2

# Columns to derive from existing data
derive:
  # For 2018-2023: SOR_STRAIGHT = 1 - SOR_LGB (where SOR_LGB is not null)
  SOR_STRAIGHT:
    from: SOR_LGB
    formula: "1 - SOR_LGB"
    years: [2018, 2019, 2020, 2021, 2022, 2023]

# AGE_GROUP bins differ across years. Derive a consistent one from AGE.
# 2018-2022, 2024: (1)1-9 (2)10-14 (3)15-17 (4)18-24 (5)25-34 (6)35-44 (7)45-54 (8)55-64 (9)65+
# 2023:            (1)1-7 (2)8-11 (3)12-14 (4)15-17 (5)18-24 (6)25-34 (7)35-44 (8)45-54 (9)55-64 (10)65+
age_group_bins:
  # Consistent bins derived from AGE for all years (using 2024 convention)
  edges: [0, 10, 15, 18, 25, 35, 45, 55, 65, 999]
  # resulting groups: 1-9, 10-14, 15-17, 18-24, 25-34, 35-44, 45-54, 55-64, 65+
  labels: [1, 2, 3, 4, 5, 6, 7, 8, 9]

# Metadata columns added by clean step
metadata:
  - data_year      # int16, from directory name
  - county         # str, parsed from filename
  - quarter        # int8 nullable, parsed from filename (Q1-Q4) or null
  - source_file    # str, original XLSX filename

# Target column order. This is the full union schema.
# All Parquet files will have these columns in this order.
columns:
  # === Metadata (added by clean) ===
  - data_year
  - county
  - quarter
  - source_file

  # === Identifiers ===
  - DOJ_RECORD_ID
  - PERSON_NUMBER
